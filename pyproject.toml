[project]
name = "hackathon-sia"
version = "0.1.0"
description = "Self-Improving IT Incident Agent — Google ADK + MCP + Reflexion loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.25.0",
    "google-genai>=1.64.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
    "ddtrace>=4.0.0",
    "braintrust>=0.5.0",
    "autoevals>=0.1.0",
    "streamlit>=1.35.0",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.uv]
# Resolve only releases uploaded before this date (a cooldown, fixed when set). Being in the project, it
# overrides a user-level exclude-newer (uv.toml), so `uv lock --check` gives the same answer on any machine.
# Don't add `--no-config`: it skips this [tool.uv] table too, and the check then fails.
exclude-newer = "2026-10-04T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
